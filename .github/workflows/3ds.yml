# The Nintendo 3DS build (platform/3ds): armgba.3dsx for the Homebrew Launcher and armgba.cia for
# the HOME Menu, as artifacts, and on a published release, attached to it.
name: 3ds

on:
  push:
    paths: ['platform/3ds/**', 'src/**', 'libretro/**', 'gambatte/**', '.github/workflows/3ds.yml']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: bannertool
        run: |
          curl -fsSL -o /tmp/bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -q /tmp/bannertool.zip -d /tmp/bannertool
          install /tmp/bannertool/linux-x86_64/bannertool /usr/local/bin/
      - name: Build
        run: make -C platform/3ds -j"$(nproc)" all build/banner.bnr build/icon.icn
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            platform/3ds/armgba.3dsx
            platform/3ds/armgba.elf
            platform/3ds/armgba.rsf
            platform/3ds/build/banner.bnr
            platform/3ds/build/icon.icn

  # makerom's release binaries need a newer glibc than devkitARM's image has: packed on the runner.
  cia:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: makerom
        run: |
          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -q makerom.zip -d makerom
          chmod +x makerom/makerom
      - name: CIA
        run: |
          cd build
          ../makerom/makerom -f cia -o armgba.cia -elf armgba.elf -rsf armgba.rsf -target t -exefslogo \
            -icon build/icon.icn -banner build/banner.bnr
      - uses: actions/upload-artifact@v4
        with:
          name: armgba-3ds
          path: |
            build/armgba.3dsx
            build/armgba.cia
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/armgba.3dsx build/armgba.cia --clobber -R "${{ github.repository }}"
